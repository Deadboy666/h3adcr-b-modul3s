server {
    server_name headcrab.bifrosthub.ru;

    # Static Steam client build mirror consumed by headcrab.sh/dlm. Plain
    # unauthenticated GET-by-exact-filename, matching how Valve's own CDN
    # (client-update.fastly.steamstatic.com) serves these -- Steam's
    # bootstrapper verifies content via the sha1 baked into each filename
    # and the sha2/sha2vz fields in the manifest, not via any server-side
    # auth, so this has to stay a plain static file host to stay
    # protocol-compatible.
    location / {
        root /srv/headcrab;
        autoindex off;
        try_files $uri =404;

        add_header Access-Control-Allow-Origin "*" always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:php|pl|py|sh|cgi|asp|aspx|jsp)$ { deny all; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/headcrab.bifrosthub.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/headcrab.bifrosthub.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = headcrab.bifrosthub.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name headcrab.bifrosthub.ru;
    return 404; # managed by Certbot


}
